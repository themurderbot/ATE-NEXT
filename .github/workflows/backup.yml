name: Daily Supabase Backup
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          pg_dump "$DB_URL" --no-owner --no-acl | gzip > backups/backup-$(date +%Y%m%d).sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backups/